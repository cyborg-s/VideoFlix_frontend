<section class="headerSection">
  <img
    (click)="goToStartpage()"
    class="mobileLogo"
    src="assets/img/Capa_1.svg"
    alt="Videoflix Logo"
  />
  <img
    (click)="goToStartpage()"
    class="desktopLogo"
    src="assets/img/Logo.svg"
    alt="Videoflix Logo"
  />

  <button
    *ngIf="!isLoggedIn && router.url !== '/login'"
    (click)="goToLogin()"
    class="loginButton"
  >
    LogIn
  </button>

  <button
    *ngIf="isLoggedIn && (router.url === '/dashboard' || router.url === '/legalnotice' || router.url === '/imprint' || router.url.startsWith('/video/'))"
    (click)="logOut()"
    class="loginButton"
  >
    <img src="../../assets/img/logout.svg" alt="" />
    LogOut
  </button>
</section>
